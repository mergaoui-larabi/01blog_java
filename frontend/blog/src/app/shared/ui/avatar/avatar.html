<div class="app-avatar" [ngClass]="'app-avatar-' + size()"
    [attr.aria-label]="name() ? name() + '\'s avatar' : 'User avatar'">
    @if (avatarUrl() && !imageFailed()) {
    <img [src]="avatarUrl()" [alt]="name() ? name() + '\'s avatar' : 'User avatar'" (error)="onImageError()" />
    } @else {
    <img src="/assets/avatar/avatar.webp" [alt]="name() ? name() + '\'s avatar' : 'User avatar'"
        (error)="onImageError()" />
    }
</div>
