<div class="d-flex align-items-center gap-2">

  <button
    type="button"
    (click)="themeService.toggle()"
    [attr.aria-label]="
      themeService.theme() === 'light'
        ? 'Switch to dark mode'
        : 'Switch to light mode'
    "
    class="btn btn-ghost rounded-circle d-flex align-items-center justify-content-center"
    style="width: 3rem; height: 3rem"
  >
    @if (themeService.theme() === 'light') {

      <!-- Sun -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        width="40"
        height="40"
        class="text-primary app-theme-icon"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />

        <path
          stroke-linecap="round"
          d="M12 2v2
             M12 20v2
             M4.93 4.93l1.41 1.41
             M17.66 17.66l1.41 1.41
             M2 12h2
             M20 12h2
             M4.93 19.07l1.41-1.41
             M17.66 6.34l1.41-1.41"
        />
      </svg>

    } @else {

      <!-- Moon -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        width="40"
        height="40"
        class="text-primary app-theme-icon"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 12.79
             A9 9 0 1 1 11.21 3
             A7 7 0 0 0 21 12.79Z"
        />
      </svg>

    }
  </button>
</div>
