<!-- Backdrop -->
<div #root (click)="onBackdrop($event)" class="fixed inset-0 z-50 flex items-end justify-center
     bg-black/40 p-0 sm:items-center sm:p-4">

  <!-- Panel -->
  <div #panel role="dialog" aria-modal="true" aria-labelledby="dialog-title" [attr.aria-describedby]="describedBy()"
    (keydown)="onKeydown($event)" [class]="'w-full ' + maxWidth() + ' max-h-[90vh] overflow-y-auto rounded-t-2xl
       border border-border bg-surface p-6 shadow-xl
       sm:rounded-2xl'" tabindex="-1">

    <div class="flex items-start justify-between gap-4">
      <h2 id="dialog-title" class="text-lg font-semibold tracking-tight text-text">
        {{ title() }}
      </h2>

      <button type="button" (click)="closed.emit()" aria-label="Close dialog" class="-m-1.5 flex h-8 w-8 shrink-0
             items-center justify-center rounded-lg p-1.5 text-text-muted
             transition-colors hover:bg-background hover:text-text
             focus:outline-none focus:ring-2 focus:ring-primary/30">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    @if (description(); as desc) {
    <p id="dialog-description" class="mt-1 text-sm text-text-muted">
      {{ desc }}
    </p>
    }

    <div class="mt-4">
      <ng-content />
    </div>
  </div>
</div>
