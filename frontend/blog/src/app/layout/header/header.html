<header class="sticky top-0 z-50 border-b border-border bg-surface/95 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8"
        aria-label="Main navigation">

        <!-- Brand -->
        <a routerLink="/"
            class="flex items-center gap-2 text-xl font-bold tracking-tight text-text transition-colors hover:text-primary"
            aria-label="CBlog home">
            <app-logo />
        </a>

        <!-- Desktop search -->
        <div class="hidden md:flex flex-1 justify-center px-6">
            <div class="relative w-full max-w-md">
                <!-- Search icon -->
                <svg class="pointer-events-none absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-text-muted"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                </svg>

                <input type="search" placeholder="Search \>log" class="w-full rounded-full border border-border bg-text-bg py-2 pl-10
                        pr-4 text-sm text-text outline-none transition-all
                        placeholder:text-text-muted focus:border-primary focus:ring-2 focus:ring-primary/20" />
            </div>
        </div>

        <!-- Right side -->
        <div class="flex items-center gap-2">

            <!-- Notifications -->
            <a routerLink="/notifications"
                class="relative flex h-10 w-10 items-center justify-center rounded-lg text-text-muted transition-colors hover:bg-background hover:text-text"
                aria-label="Notifications">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>

                <!-- Unread indicator -->
                <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-danger"
                    aria-label="Unread notifications"></span>
            </a>

            <!-- Profile -->
            <a routerLink="/profile"
                class="flex items-center gap-2 rounded-lg p-1.5 transition-colors hover:bg-background"
                aria-label="Your profile">
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary text-sm font-semibold text-white"
                    aria-hidden="true">
                    U
                </div>

                <span class="hidden text-sm font-medium text-text lg:block">
                    User
                </span>
            </a>

            <!-- Theme -->
            <app-theme-toggle />
        </div>

    </nav>
</header>
