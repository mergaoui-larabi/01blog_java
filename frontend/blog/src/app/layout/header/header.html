<header class="app-header position-sticky top-0 shadow-sm">
  <nav class="d-flex flex-nowrap align-items-center justify-content-between gap-2 gap-sm-3 px-3 px-sm-6 px-lg-8"
    style="height: 4rem" aria-label="Main navigation">
    <!-- Brand -->
    <a routerLink="/" (click)="closeMenus()"
      class="d-flex flex-shrink-0 align-items-center gap-2 fs-5 fw-bold tracking-tight text-decoration-none text-body app-header-brand"
      aria-label="01Blog home">
      <app-logo />
    </a>

    <!-- Primary navigation: centred in the space left by the brand and the account actions -->
    <ul
      class="d-none d-md-flex flex-grow-1 flex-nowrap align-items-center justify-content-center gap-1 list-unstyled mb-0">
      <!-- Feed -->
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="app-nav-link"
          aria-label="Feed" title="Feed">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h7" />
          </svg>
          <span class="app-nav-link-label">Feed</span>
        </a>
      </li>

      <!-- Explore -->
      <li>
        <a routerLink="/explore" routerLinkActive="active" class="app-nav-link" aria-label="Explore" title="Explore">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <span class="app-nav-link-label">Explore</span>
        </a>
      </li>

      <!-- My Block -->
      <li>
        <a routerLink="/block/me" routerLinkActive="active" class="app-nav-link" aria-label="My block"
          title="My block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
          </svg>
          <span class="app-nav-link-label">Block</span>
        </a>
      </li>

      <!-- Admin -->
      @if (isAdmin()) {
      <li>
        <a routerLink="/admin" routerLinkActive="active" class="app-nav-link" aria-label="Admin" title="Admin">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3 20 6v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <span class="app-nav-link-label">Admin</span>
        </a>
      </li>
      }
    </ul>

    <!-- User actions -->
    <div class="d-flex flex-nowrap flex-shrink-0 align-items-center gap-2 gap-sm-3">
      @if (user(); as currentUser) {
      <!-- Notifications -->
      <a routerLink="/notifications" routerLinkActive="active" aria-label="Notifications" title="Notifications"
        class="app-nav-link p-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
        </svg>
      </a>

      <!-- Avatar -->
      <a routerLink="/block/me" aria-label="My block" title="My block" class="d-flex align-items-center">
        <app-avatar />
      </a>

      <!-- Username -->
      <a routerLink="/block/me" routerLinkActive="active"
        class="d-none d-md-block text-truncate text-body text-decoration-none fw-medium"
        style="font-size: 0.875rem; max-width: 10rem" [attr.aria-label]="'Open ' + currentUser.username + '\'s block'">
        {{ currentUser.username }}
      </a>

      <!-- Logout: only from md up, below that the mobile menu carries the action -->
      <button type="button" (click)="logout()" aria-label="Log out" title="Log out"
        class="btn btn-ghost d-none d-md-flex align-items-center justify-content-center"
        style="width: 2.5rem; height: 2.5rem">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M12 3h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6" />
        </svg>
      </button>
      }

      <!-- Theme -->
      <app-theme-toggle />

      <!-- Mobile menu toggle -->
      <button type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-menu" aria-label="Toggle navigation menu"
        class="btn btn-ghost d-flex align-items-center justify-content-center d-md-none"
        style="width: 2.5rem; height: 2.5rem">
        @if (mobileMenuOpen()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path d="M6 18 18 6M6 6l12 12" />
        </svg>
        } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        }
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  @if (mobileMenuOpen()) {
  <div id="mobile-menu" class="app-mobile-menu border-top bg-body px-3 py-3 d-md-none">
    <ul class="list-unstyled mb-0 d-flex flex-column gap-1">
      <li>
        <a routerLink="/" (click)="closeMenus()" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          class="app-nav-link">
          Feed
        </a>
      </li>

      <li>
        <a routerLink="/explore" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          Explore
        </a>
      </li>

      <li>
        <a routerLink="/block/me" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          My Block
        </a>
      </li>

      <li>
        <a routerLink="/notifications" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          Notifications
        </a>
      </li>

      @if (isAdmin()) {
      <li>
        <a routerLink="/admin" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          Admin
        </a>
      </li>
      }

      @if (user()) {
      <li>
        <button type="button" (click)="logout()" class="app-dropdown-item app-dropdown-item-danger px-3 py-2">
          Log out
        </button>
      </li>
      }
    </ul>
  </div>
  }
</header>
