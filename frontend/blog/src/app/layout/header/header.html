<header class="app-header position-sticky top-0 shadow-sm">
  <nav class="position-relative d-flex align-items-center justify-content-between gap-4 px-4 px-sm-6 px-lg-8"
    style="height: 4rem" aria-label="Main navigation">
    <!-- Brand -->
    <a routerLink="/" (click)="closeMenus()"
      class="d-flex align-items-center gap-2 fs-5 fw-bold tracking-tight text-decoration-none text-body app-header-brand"
      aria-label="01Blog home">
      <app-logo />
    </a>

    <!-- Desktop primary navigation -->
    <ul class="position-absolute top-50 start-50 translate-middle d-none d-md-flex align-items-center gap-1 list-unstyled mb-0">
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          #rlaFeed="routerLinkActive" [attr.aria-current]="rlaFeed.isActive ? 'page' : null"
          class="app-nav-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7" />
          </svg>

          Feed
        </a>
      </li>

      <li>
        <a routerLink="/explore" routerLinkActive="active" #rlaExplore="routerLinkActive"
          [attr.aria-current]="rlaExplore.isActive ? 'page' : null" class="app-nav-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-4.35-4.35M18 10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0z" />
          </svg>

          Explore
        </a>
      </li>

      <li>
        <a routerLink="/notifications" routerLinkActive="active" #rlaNotif="routerLinkActive"
          [attr.aria-current]="rlaNotif.isActive ? 'page' : null" class="app-nav-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>

          Notifications
        </a>
      </li>
    </ul>

    <!-- Right side -->
    <div class="d-flex align-items-center gap-2">
      <!-- Account (desktop) -->
      @if (user(); as currentUser) {
      <app-avatar />
      <div class="position-relative d-none d-md-block">
        <button type="button" (click)="toggleAccountMenu()" [attr.aria-expanded]="accountMenuOpen()"
          aria-haspopup="menu" aria-controls="account-menu" class="app-account-toggle">
          <span class="text-truncate max-w-8 fw-medium text-body" style="font-size: 0.875rem">
            {{ currentUser.username }}
          </span>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="text-secondary" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
          </svg>
        </button>

        @if (accountMenuOpen()) {
        <div id="account-menu" role="menu" class="app-dropdown">
          <a role="menuitem" routerLink="/block/me" (click)="closeMenus()" class="app-dropdown-item">
            My Block
          </a>

          <a role="menuitem" routerLink="/notifications" (click)="closeMenus()" class="app-dropdown-item">
            Notifications
          </a>

          <hr class="my-1 border-top border-0" />

          <button type="button" role="menuitem" (click)="logout()"
            class="app-dropdown-item app-dropdown-item-danger">
            Log out
          </button>
        </div>
        }
      </div>
      }

      <!-- Theme -->
      <app-theme-toggle />

      <!-- Mobile menu toggle -->
      <button type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-menu" aria-label="Toggle navigation menu"
        class="btn btn-ghost d-flex align-items-center justify-content-center d-md-none"
        style="width: 2.5rem; height: 2.5rem">
        @if (mobileMenuOpen()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        }
      </button>
    </div>
  </nav>

  <!-- Mobile menu (pushes content down; never overlaps) -->
  @if (mobileMenuOpen()) {
  <div id="mobile-menu" class="border-top bg-body px-4 py-3 d-md-none">
    <ul class="list-unstyled mb-0 d-flex flex-column gap-1">
      <li>
        <a routerLink="/" (click)="closeMenus()" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" class="app-nav-link">
          Feed
        </a>
      </li>

      <li>
        <a routerLink="/explore" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          Explore
        </a>
      </li>

      <li>
        <a routerLink="/notifications" (click)="closeMenus()" routerLinkActive="active"
          class="app-nav-link justify-content-between">
          Notifications
        </a>
      </li>

      <li>
        <a routerLink="/block/me" (click)="closeMenus()" routerLinkActive="active" class="app-nav-link">
          My Block
        </a>
      </li>

      @if (user()) {
      <li>
        <hr class="my-2 border-top border-0" />

        <button type="button" (click)="logout()" class="app-dropdown-item app-dropdown-item-danger px-3 py-2">
          Log out
        </button>
      </li>
      }
    </ul>
  </div>
  }
</header>
