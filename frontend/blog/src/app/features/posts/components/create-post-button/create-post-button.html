<button type="button" (click)="openCreatePost()" aria-label="Create a post" title="Create a post" class="fixed right-4 bottom-4 z-40 flex h-14 w-14 items-center
         justify-center rounded-full bg-primary text-white shadow-lg
         transition-all duration-200 ease-out hover:scale-105
         hover:shadow-xl hover:bg-primary/90 active:scale-95
         focus-visible:outline-none focus-visible:ring-2
         focus-visible:ring-primary focus-visible:ring-offset-2
         sm:right-6 sm:bottom-6 sm:h-16 sm:w-16">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" class="h-7 w-7" aria-hidden="true">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z" />
    </svg>
</button>
<app-create-post-dialog (published)="onPostPublished($event)" />
