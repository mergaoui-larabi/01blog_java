<dialog #dialog (click)="onBackdropClick($event)" (close)="onClose()" aria-labelledby="create-post-title" class="m-auto h-[90dvh] max-h-[90dvh] w-[80vw] max-w-none
         overflow-y-auto rounded-2xl border border-border
         bg-surface p-0 text-text shadow-2xl
         backdrop:bg-black/50 backdrop:backdrop-blur-sm">
    <div class="flex items-center justify-between border-b border-border px-6 py-4">
        <h2 id="create-post-title" class="text-lg font-semibold">
            Create a post
        </h2>

        <button type="button" (click)="close()" aria-label="Close dialog" class="flex h-9 w-9 items-center justify-center rounded-full
         text-text-muted transition
         hover:bg-text-bg hover:text-text
         focus-visible:outline-none focus-visible:ring-2
         focus-visible:ring-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </button>

    </div>

    <section class="flex h-[calc(90dvh-4.5rem)] min-h-0 flex-col gap-4 p-6">
        <label for="post-content" class="text-sm font-medium text-text">
            What's on your mind?
        </label>

        <textarea id="post-content" [value]="content()" (input)="content.set($any($event.target).value)"
            placeholder="Share something with your community..." class="min-h-24 w-full resize-y rounded-xl border border-border
           bg-background p-3 text-text outline-none transition
           placeholder:text-text-muted focus:border-primary
           focus:ring-2 focus:ring-primary/20"></textarea>

        <div class="h-1/2 min-h-0 w-full">
            <app-media-upload-preview (filesChange)="onFilesChange($event)" (uploadCancelled)="onUploadCancelled()"
                [uploading]="uploading()" [uploadProgress]="uploadProgress()" />
        </div>

        <button type="button" (click)="publishPost()" [disabled]="uploading() || !content().trim()" class="rounded-xl bg-primary px-6 py-3 font-semibold
           text-white transition hover:bg-primary-hover
           disabled:cursor-not-allowed disabled:opacity-50">
            {{ uploading() ? 'Publishing...' : 'Publish' }}
        </button>
    </section>
</dialog>
