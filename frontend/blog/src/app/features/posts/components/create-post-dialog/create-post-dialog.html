<dialog #dialog (click)="onBackdropClick($event)" (close)="onClose()" aria-labelledby="create-post-title"
    class="app-dialog">
    <div class="app-dialog-header">
        <h2 id="create-post-title" class="fs-5 fw-semibold mb-0">
            Create a post
        </h2>

        <button type="button" (click)="close()" aria-label="Close dialog" class="app-dialog-close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"
                aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </button>

    </div>

    <section class="app-dialog-body app-dialog-body-fill">
        <label for="post-content" class="fw-medium">
            What's on your mind?
        </label>

        <textarea id="post-content" [value]="content()" (input)="content.set($any($event.target).value)"
            placeholder="Share something with your community..." class="form-control bg-surface w-100 flex-grow-0"
            style="min-height: 6rem; resize: none"></textarea>

        <div class="min-w-0 w-100" style="height: 50%; min-height: 0">
            <app-media-upload-preview (filesChange)="onFilesChange($event)" (uploadCancelled)="onUploadCancelled()"
                [uploading]="uploading()" [uploadProgress]="uploadProgress()" />
        </div>

        <button type="button" (click)="publishPost()" [disabled]="uploading() || !content().trim()"
            class="btn btn-primary rounded-xl px-4 py-3 fw-semibold align-self-start w-100">
            {{ uploading() ? 'Publishing...' : 'Publish' }}
        </button>
    </section>
</dialog>
