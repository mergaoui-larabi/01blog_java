<article class="app-card app-card-hover mb-3">
    <button type="button" class="d-block w-100 text-start border-0 bg-transparent p-5 rounded-2xl app-card-trigger"
        (click)="openPost()" [attr.aria-label]="'Open post: ' + previewContent()">
        <!-- Post content -->
        <div>
            <p class="text-wrap-pretty mb-0 text-sm text-body" style="line-height: 1.75rem">
                {{ previewContent() }}
            </p>
        </div>

        <!-- Media preview placeholder -->
        @if (post().mediaIds.length > 0) {
        <div class="app-media-strip mt-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                class="flex-shrink-0" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="m21 15-5-5L5 21" />
            </svg>

            <span>
                {{ post().mediaIds.length }}
                {{ post().mediaIds.length === 1 ? 'attachment' : 'attachments' }}
            </span>
        </div>
        }

        <!-- Post statistics -->
        <div class="app-stats mt-5">
            <!-- Likes -->
            <span class="app-stat">
                <svg width="20" height="20" [class.text-danger]="post().likedByCurrentUser" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5
               5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5
               5.5 0 0 0-.1-7.8Z" />
                </svg>

                <span>
                    {{ post().likesCount }}
                    {{ post().likesCount === 1 ? 'like' : 'likes' }}
                </span>
            </span>

            <!-- Comments -->
            <span class="app-stat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    aria-hidden="true">
                    <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8
               8.5 8.5 0 0 1-7.6 4.7
               8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7
               a8.4 8.4 0 0 1-.9-3.8
               8.5 8.5 0 0 1 4.7-7.6
               8.4 8.4 0 0 1 3.8-.9h.5
               a8.5 8.5 0 0 1 8 8v.5Z" />
                </svg>

                <span>
                    {{ post().commentsCount }}
                    {{ post().commentsCount === 1 ? 'comment' : 'comments' }}
                </span>
            </span>

            <!-- Timestamp -->
            <span class="app-stat app-stat-late">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>

                <time [attr.datetime]="post().createdAt">
                    {{ post().createdAt | date: 'mediumDate' }}
                </time>
            </span>
        </div>

        <!-- Edited indicator -->
        @if (isEdited()) {
        <p class="mt-3 mb-0 text-xs text-secondary">
            Edited
            <time [attr.datetime]="post().updatedAt">
                {{ post().updatedAt | date: 'medium' }}
            </time>
        </p>
        }
    </button>
</article>
