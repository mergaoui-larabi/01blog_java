<article class="mb-3 group cursor-pointer rounded-2xl border border-border bg-surface
         transition-colors hover:border-primary/40">
    <button type="button" class="block w-full rounded-2xl p-5 text-left
           focus-visible:outline-2 focus-visible:outline-offset-2
           focus-visible:outline-primary" (click)="openPost()" [attr.aria-label]="'Open post: ' + previewContent()">
        <!-- Post content -->
        <div>
            <p class="whitespace-pre-wrap break-words text-sm leading-7 text-text">
                {{ previewContent() }}
            </p>
        </div>

        <!-- Media preview placeholder -->
        @if (post().mediaIds.length > 0) {
        <div class="mt-4 flex items-center gap-2 rounded-xl border border-border
               bg-background px-4 py-3 text-sm text-text-muted">
            <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="m21 15-5-5L5 21" />
            </svg>

            <span>
                {{ post().mediaIds.length }}
                {{ post().mediaIds.length === 1 ? 'attachment' : 'attachments' }}
            </span>
        </div>
        }

        <!-- Post statistics -->
        <div class="mt-5 flex flex-wrap items-center gap-x-5 gap-y-3
             border-t border-border pt-4 text-sm text-text-muted">
            <!-- Likes -->
            <span class="inline-flex items-center gap-2">
                <svg class="size-5" [class.text-danger]="post().likedByCurrentUser" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5
               5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5
               5.5 0 0 0-.1-7.8Z" />
                </svg>

                <span>
                    {{ post().likesCount }}
                    {{ post().likesCount === 1 ? 'like' : 'likes' }}
                </span>
            </span>

            <!-- Comments -->
            <span class="inline-flex items-center gap-2">
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    aria-hidden="true">
                    <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8
               8.5 8.5 0 0 1-7.6 4.7
               8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7
               a8.4 8.4 0 0 1-.9-3.8
               8.5 8.5 0 0 1 4.7-7.6
               8.4 8.4 0 0 1 3.8-.9h.5
               a8.5 8.5 0 0 1 8 8v.5Z" />
                </svg>

                <span>
                    {{ post().commentsCount }}
                    {{ post().commentsCount === 1 ? 'comment' : 'comments' }}
                </span>
            </span>

            <!-- Timestamp -->
            <span class="ml-auto inline-flex items-center gap-1.5">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                    aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 2" />
                </svg>

                <time [attr.datetime]="post().createdAt">
                    {{ post().createdAt | date: 'mediumDate' }}
                </time>
            </span>
        </div>

        <!-- Edited indicator -->
        @if (isEdited()) {
        <p class="mt-3 text-xs text-text-muted">
            Edited
            <time [attr.datetime]="post().updatedAt">
                {{ post().updatedAt | date: 'medium' }}
            </time>
        </p>
        }
    </button>
</article>
