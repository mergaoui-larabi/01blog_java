<div class="w-full">

  <!-- Heading -->
  <header class="mb-5 flex justify-center">
    <h1 class="text-2xl font-semibold tracking-tight text-text">
      Log In
    </h1>

  </header>

  <!-- Login form -->

  <form [formRoot]="loginForm" class="space-y-5">

    <!-- Email -->
    <div class="relative">
      <input id="email" type="email" autocomplete="email" placeholder=" " [formField]="loginForm.email" class="peer w-full rounded-lg border border-border bg-surface
           px-4 py-3 text-sm leading-5 text-text outline-none transition
           focus:border-primary focus:ring-2 focus:ring-primary/10" />

      <label for="email" class="pointer-events-none absolute left-4 top-3
            px-1 text-sm leading-5 text-text-muted
           transition-all duration-200
           peer-focus:top-0
           peer-focus:text-xs
           peer-focus:leading-4
           peer-focus:text-primary
           peer-[:not(:placeholder-shown)]:top-0
           peer-[:not(:placeholder-shown)]:text-xs
           peer-[:not(:placeholder-shown)]:leading-4">
        Email
      </label>

      @if (
      loginForm.email().touched() &&
      loginForm.email().invalid()
      ) {
      <p class="mt-2 text-sm text-danger" role="alert">
        {{ loginForm.email().errors()[0].message }}
      </p>
      }
    </div>

    <!-- Password -->
    <div>
      <div class="relative">
        <input id="password" type="password" autocomplete="current-password" placeholder=" "
          [formField]="loginForm.password" class="peer w-full rounded-lg border border-border bg-surface
             px-4 py-3 text-sm leading-5 text-text outline-none transition
             focus:border-primary focus:ring-2 focus:ring-primary/10" />

        <label for="password" class="pointer-events-none absolute left-4 top-3
            px-1 text-sm leading-5 text-text-muted
             transition-all duration-200
             peer-focus:top-0
             peer-focus:text-xs
             peer-focus:leading-4
             peer-focus:text-primary
             peer-[:not(:placeholder-shown)]:top-0
             peer-[:not(:placeholder-shown)]:text-xs
             peer-[:not(:placeholder-shown)]:leading-4">
          Password
        </label>

        @if (
        loginForm.password().touched() &&
        loginForm.password().invalid()
        ) {
        <p class="mt-2 text-sm text-danger" role="alert">
          {{ loginForm.password().errors()[0].message }}
        </p>
        }
      </div>
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="loginForm().invalid() || loginForm().submitting()" class="w-full rounded-lg bg-primary px-4 py-3
         text-sm font-semibold text-white transition
         hover:bg-primary-hover
         focus:outline-none focus:ring-2 focus:ring-primary
         focus:ring-offset-2
         disabled:cursor-not-allowed disabled:opacity-60">
      @if (loginForm().submitting()) {
      <span class="flex items-center justify-center gap-2">
        <span class="h-4 w-4 animate-spin rounded-full
               border-2 border-white/30 border-t-white" aria-hidden="true"></span>

        Signing in...
      </span>
      } @else {
      Sign in
      }
    </button>

  </form>

  <!-- Register -->

  <div class="mt-6 text-center text-sm text-text-muted"> New to 01Blog? <a routerLink="/auth/register"
      class="ml-1 font-semibold text-primary transition hover:text-primary-hover hover:underline"> Sign up </a> </div>

</div>
