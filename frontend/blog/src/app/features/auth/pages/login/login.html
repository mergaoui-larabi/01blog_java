<div class="w-100">

  <!-- Heading -->
  <header class="d-flex justify-content-center mb-5">
    <h1 class="fs-4 fw-semibold tracking-tight mb-0">
      Log In
    </h1>

  </header>

  <!-- Login form -->

  <form [formRoot]="loginForm" class="d-flex flex-column gap-3">

    <!-- Email -->
    <div>
      <div class="form-floating">
        <input id="email" type="email" autocomplete="email" placeholder=" " [formField]="loginForm.email"
          class="form-control auth-input" />

        <label for="email">Email</label>
      </div>

      @if (
      loginForm.email().touched() &&
      loginForm.email().invalid()
      ) {
      <p class="mt-2 mb-0 text-sm text-danger" role="alert">
        {{ loginForm.email().errors()[0].message }}
      </p>
      }
    </div>

    <!-- Password -->
    <div>
      <div class="form-floating">
        <input id="password" type="password" autocomplete="current-password" placeholder=" "
          [formField]="loginForm.password" class="form-control auth-input" />

        <label for="password">Password</label>
      </div>

      @if (
      loginForm.password().touched() &&
      loginForm.password().invalid()
      ) {
      <p class="mt-2 mb-0 text-sm text-danger" role="alert">
        {{ loginForm.password().errors()[0].message }}
      </p>
      }
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="loginForm().invalid() || loginForm().submitting()"
      class="btn btn-primary w-100 py-3 fw-semibold">
      @if (loginForm().submitting()) {
      <span class="d-flex align-items-center justify-content-center gap-2">
        <span class="spinner-border spinner-border-sm" style="width: 1rem; height: 1rem" aria-hidden="true"></span>

        Signing in...
      </span>
      } @else {
      Sign in
      }
    </button>

  </form>

  <!-- Register -->

  <div class="mt-6 text-center text-sm text-secondary"> New to Blog? <a routerLink="/auth/register"
      class="ms-1 fw-semibold text-decoration-none auth-link"> Sign up </a> </div>

</div>
