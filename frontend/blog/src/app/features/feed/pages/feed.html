<section class="flex-grow-1 p-4">
  <app-create-post-button (published)="onPostPublished($event)" />
  @for (post of feedService.posts(); track post.id) {
  <app-post-card [post]="post" (clicked)="openPost($event)" />
  } @empty {
  @if (!feedService.loading()) {
  <p class="py-8 text-center text-secondary">
    No posts to display.
  </p>
  }
  }
</section>

<app-post-view-dialog />
