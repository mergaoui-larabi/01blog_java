@if (user(); as currentUser) {
<div class="app-card-static w-100 d-flex flex-column align-items-center text-center p-4">
    <app-avatar [mediaId]="currentUser.avatarMediaId" [name]="currentUser.username" size="xl" />

    <p class="mt-3 mb-0 fw-semibold text-body">
        {{ currentUser.username }}
    </p>

    <div class="mt-3 d-flex align-items-center gap-2">
        @if (!user()?.sameUser && !isOwnProfile()){
        <app-follow-button [followed]="currentUser.followedByCurrentUser" (followChange)="onFollowChange($event)" />

        <app-report-button targetType="USER" [targetId]="currentUser.id" />
        }
    </div>
</div>
}
