<article class="app-card-static d-flex align-items-center gap-3 p-4">
    <a class="app-user-link d-flex min-w-0 flex-grow-1 align-items-center gap-3 cursor-pointer"
        [routerLink]="['/block', user().username]"
        [attr.aria-label]="'Open ' + user().username + '\'s block'"
        [attr.title]="'Open ' + user().username + '\'s block'">
        <app-avatar [mediaId]="user().avatarMediaId" [name]="user().username" size="lg" />
        <div class="min-w-0 flex-grow-1">
            <p class="mb-0 text-truncate fw-semibold text-body">{{ user().username }}</p>
        </div>
    </a>

    <app-follow-button [followed]="user().followedByCurrentUser" (followChange)="onFollowChange($event)" />
</article>
