<article class="flex items-center gap-3 rounded-xl border border-border bg-surface p-4">
    <app-avatar [mediaId]="user().avatarMediaId" [name]="user().username" size="lg" />
    <div class="min-w-0 flex-1">
        <p class="truncate font-semibold text-text">{{ user().username }}</p>
    </div>

    <app-follow-button [followed]="user().followedByCurrentUser" (followChange)="onFollowChange($event)" />
</article>
