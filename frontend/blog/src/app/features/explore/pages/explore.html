<section class="flex-grow-1 min-w-0 p-4 p-sm-6">
  <div class="mx-auto w-100 d-flex flex-column gap-6" style="max-width: 48rem">

    <header>
      <h1 class="fs-3 fw-bold mb-0">Explore</h1>
      <p class="mt-1 mb-0 text-sm text-secondary">
        Discover people in your community.
      </p>
    </header>

    <!-- Search -->
    <input #searchInput type="search" placeholder="Search users by username..." aria-label="Search users"
      (input)="search(searchInput.value)" class="form-control form-control-lg rounded-xl" />

    <!-- Loading -->
    @if (exploreService.loading() && !exploreService.hasUsers()) {
    <p class="py-8 text-center text-secondary">Loading users...</p>
    }

    <!-- User cards -->
    <div class="d-flex flex-column gap-3">
      @for (user of exploreService.users(); track user.id) {
      <app-user-card [user]="user" (followChange)="onFollowChange($event)" />
      } @empty {
      @if (!exploreService.loading()) {
      <p class="py-8 text-center text-secondary">
        No users found.
      </p>
      }
      }
    </div>

    <!-- Load more -->
    @if (exploreService.hasUsers()) {
    <button type="button" (click)="loadMore()" [disabled]="exploreService.loading() || !exploreService.nextCursor()"
      class="btn w-100 rounded-xl py-3 fw-semibold text-body border auth-file-label">
      {{ exploreService.loading() ? 'Loading...' : 'Load more' }}
    </button>
    }

  </div>
</section>
