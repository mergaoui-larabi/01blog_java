<section class="flex-grow-1 w-100 p-4">
  <!-- Profile header -->
  <app-user-profile [user]="user()" (followChange)="onFollowChange($event)" />

  <!-- Create post -->
  <app-create-post-button (published)="onPostPublished($event)" />

  <!-- Posts -->
  <div class="mt-4 d-flex flex-column gap-4">
    @for (post of blockService.posts(); track post.id) {
    <app-post-card [post]="post" (clicked)="openPost($event)" />
    } @empty {
    @if (!blockService.loading()) {
    <p class="py-8 text-center text-secondary">
      No posts to display.
    </p>
    }
    }
  </div>
</section>

<app-post-view-dialog />
