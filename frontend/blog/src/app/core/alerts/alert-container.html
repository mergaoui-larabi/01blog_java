<div class="app-alert-stack" aria-label="Alerts">
    @for (alert of alertService.alerts(); track alert.id) {
    <div class="app-alert" [ngClass]="'app-alert-' + alert.type"
        [attr.role]="alert.type === 'error' ? 'alert' : 'status'"
        [attr.aria-live]="alert.type === 'error' ? 'assertive' : 'polite'">
        <div class="app-alert-icon" [ngClass]="'app-alert-icon-' + alert.type" aria-hidden="true">
            @switch (alert.type) {
            @case ('success') { ✓ }
            @case ('error') { ! }
            @case ('warning') { ⚠ }
            @case ('info') { i }
            }
        </div>

        <p class="min-w-0 flex-1 pt-1 mb-0" style="font-size: 0.875rem; line-height: 1.25rem">
            {{ alert.message }}
        </p>

        <button type="button" class="app-alert-dismiss" aria-label="Dismiss alert"
            (click)="alertService.dismiss(alert.id)">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    }
</div>
