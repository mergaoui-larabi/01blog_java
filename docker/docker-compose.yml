services:

  postgres-users:
    image: postgres:17
    container_name: blog-postgres-users
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_users_data:/var/lib/postgresql/data


  postgres-media:
    image: postgres:17
    container_name: blog-postgres-media
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${MEDIA_DB_USERNAME}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD}
      POSTGRES_DB: ${MEDIA_DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_media_data:/var/lib/postgresql/data


  postgres-posts:
    image: postgres:17
    container_name: blog-postgres-posts
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POST_DB_USERNAME}
      POSTGRES_PASSWORD: ${POST_DB_PASSWORD}
      POSTGRES_DB: ${POST_DB_NAME}

    ports:
      - "5434:5432"

    volumes:
      - postgres_posts_data:/var/lib/postgresql/data


  postgres-notifications:
    image: postgres:17
    container_name: blog-postgres-notifications
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${NOTIF_DB_USERNAME}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASSWORD}
      POSTGRES_DB: ${NOTIF_DB_NAME}

    ports:
      - "5435:5432"

    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data


  postgres-moderation:
    image: postgres:17
    container_name: blog-postgres-moderation
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${MOD_DB_USERNAME}
      POSTGRES_PASSWORD: ${MOD_DB_PASSWORD}
      POSTGRES_DB: ${MOD_DB_NAME}

    ports:
      - "5436:5432"

    volumes:
      - postgres_moderation_data:/var/lib/postgresql/data


  redis:
    image: redis:8
    container_name: blog-redis
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: blog-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      # KRaft node configuration: one node acts as broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Controller communication.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Internal Docker and external host listeners.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker development configuration.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Development defaults.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_users_data:
  postgres_media_data:
  postgres_posts_data:
  postgres_notifications_data:
  postgres_moderation_data:
  redis_data:
  kafka_data:
