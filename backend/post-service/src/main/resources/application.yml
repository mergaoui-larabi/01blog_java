logging:
  level:
    root: WARN
    com.blog.post: INFO

server:
  port: 5004

spring:
  main:
    banner-mode: off
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://${POST_DB_HOST:localhost:5434}/${POST_DB_NAME:blog_post}
    username: ${POST_DB_USERNAME:blog_post}
    password: ${POST_DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:5002}/.well-known/jwks.json

post:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:5001}
  media-service:
    url: ${MEDIA_SERVICE_URL:http://localhost:5003}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:5005}

# Shared secret for service-to-service calls on /internal/**
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
