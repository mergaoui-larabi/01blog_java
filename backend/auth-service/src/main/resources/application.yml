logging:
  level:
    root: WARN
    com.blog.auth: INFO

server:
  port: 5002

spring:
  main:
    banner-mode: off
  application:
    name: auth-service

auth:
  jwt:
    issuer: blog-auth-service
    expiration: 3600
    key-id: blog-auth-key-1
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
  user-service:
    url: http://localhost:5001

# Shared secret for service-to-service calls on /internal/**
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
