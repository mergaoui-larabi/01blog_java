logging:
  level:
    root: WARN
    com.blog.gateway: INFO
    # org.springframework.security: DEBUG
    # org.springframework.security.oauth2: DEBUG
    # org.springframework.security: TRACE
    # org.springframework.security.oauth2: TRACE

server:
  port: 5000

spring:
  main:
    banner-mode: off
  application:
    name: api-gateway

  # Redis connection
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
  #spring cloud
  cloud:
    gateway:
      server:
        webflux:
          # Gateway routes
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
          # Global CORS configuration
          globalcors:
            # add-to-simple-url-handler-mapping: true
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:4200"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - Authorization
                  - Content-Type

                allowCredentials: true
          #Routing configuration
          routes:
            - id: user-service

              uri: ${USER_SERVICE_URL}

              predicates:
                - Path=/api/v1/users/**
              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20

            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/api/v1/auth/**

            - id: media-service
              uri: ${MEDIA_SERVICE_URL}
              predicates:
                - Path=/api/v1/medias/**

            - id: post-service
              uri: ${POST_SERVICE_URL}
              predicates:
                - Path=/api/v1/posts/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/notifications/**

            - id: moderation-service
              uri: ${MODERATION_SERVICE_URL}
              predicates:
                - Path=/api/v1/reports/**

gateway:
  # OAuth/OIDC jwt validation
  jwt:
    jwk-set-uri: ${AUTH_SERVICE_URL}/.well-known/jwks.json
    issuer: blog-auth-service
  security:
    public-routes:
      - /api/v1/users/signup
      - /api/v1/auth/signin
      - /actuator/**
#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
