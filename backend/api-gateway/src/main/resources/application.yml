logging:
  level:
    root: WARN
    com.blog.gateway: INFO

server:
  port: 5000

spring:
  main:
    banner-mode: off
  application:
    name: api-gateway

  # Redis connection
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          # Gateway routes
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 50
          # Global CORS configuration
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:4200"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - Authorization
                  - Content-Type

                allowCredentials: true
          #Routing configuration
          routes:
            - id: user-service

              uri: http://localhost:5001

              predicates:
                - Path=/api/v1/users/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20

gateway:
  security:
    public-routes:
      - /api/v1/auth/**
      - /actuator/**
#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
