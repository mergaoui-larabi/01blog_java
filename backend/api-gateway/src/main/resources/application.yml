logging:
  level:
    root: WARN
    com.blog.gateway: INFO
    # org.springframework.security: DEBUG
    # org.springframework.security.oauth2: DEBUG
    # org.springframework.security: TRACE
    # org.springframework.security.oauth2: TRACE

server:
  port: 5000

spring:
  main:
    banner-mode: off
  application:
    name: api-gateway

  # Redis connection
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  #spring cloud
  cloud:
    gateway:
      server:
        webflux:
          # Gateway routes
          default-filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 200
          # Global CORS configuration
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:4200"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - Authorization
                  - Content-Type

                allowCredentials: true
          #Routing configuration
          routes:
            - id: user-service

              uri: http://localhost:5001

              predicates:
                - Path=/api/v1/users/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20
            - id: auth-service

              uri: http://localhost:5002

              predicates:
                - Path=/api/v1/auth/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20
            - id: media-service

              uri: http://localhost:5003

              predicates:
                - Path=/api/v1/medias/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20
            - id: post-service

              uri: http://localhost:5004

              predicates:
                - Path=/api/v1/posts/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20
            - id: notification-service

              uri: http://localhost:5005

              predicates:
                - Path=/api/v1/notifications/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20
            - id: moderation-service

              uri: http://localhost:5006

              predicates:
                - Path=/api/v1/reports/**

              filters:
                # - name: RequestRateLimiter
                #   args:
                #     key-resolver: "#{@ipKeyResolver}"
                #     redis-rate-limiter.replenishRate: 10
                #     redis-rate-limiter.burstCapacity: 20

gateway:
  # OAuth/OIDC jwt validation
  jwt:
    jwk-set-uri: http://localhost:5002/.well-known/jwks.json
    issuer: blog-auth-service
  security:
    public-routes:
      - /api/v1/users/signup
      - /api/v1/auth/signin
      - /actuator/**
#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
