logging:
  level:
    root: WARN
    com.blog.media: INFO

server:
  port: 5003

spring:
  main:
    banner-mode: off

  application:
    name: media-service

  datasource:
    url: jdbc:postgresql://${MEDIA_DB_HOST:localhost:5433}/${MEDIA_DB_NAME:blog_medias}
    username: ${MEDIA_DB_USERNAME:blog_media}
    password: ${MEDIA_DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:5002}/.well-known/jwks.json

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Media storage
media:
  storage:
    location: ${MEDIA_STORAGE_LOCATION:./media-storage}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
