logging:
  level:
    root: WARN
    com.blog.notification: INFO

server:
  port: 5005

spring:
  main:
    banner-mode: off
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${NOTIF_DB_HOST:localhost:5435}/${NOTIF_DB_NAME:blog_notifications}
    username: ${NOTIF_DB_USERNAME:blog_notification}
    password: ${NOTIF_DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:5002}/.well-known/jwks.json

notification:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:5001}

# Shared secret for service-to-service calls on /internal/**
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:local-dev-internal-token}

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
