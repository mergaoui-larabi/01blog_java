server:
  port: 5005

spring:
  main:
    banner-mode: off
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${NOTIF_DB_HOST}/${NOTIF_DB_NAME}
    username: ${NOTIF_DB_USERNAME}
    password: ${NOTIF_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:5002/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: never
