logging:
  level:
    root: WARN
    com.blog.user: INFO

server:
  port: 5001

spring:
  main:
    banner-mode: off
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST}/${USER_DB_NAME}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL}/.well-known/jwks.json
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

clients:
  post-service:
    url: ${POST_SERVICE_URL:http://localhost:5004}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:5005}
  moderation-service:
    url: ${MODERATION_SERVICE_URL:http://localhost:5006}
# Shared secret for service-to-service calls on /internal/**
internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:}

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
