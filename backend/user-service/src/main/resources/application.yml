logging:
  level:
    root: WARN
    com.blog.user: INFO

server:
  port: 5001

spring:
  main:
    banner-mode: off
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST}/${USER_DB_NAME}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:5002/.well-known/jwks.json

#Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: never
